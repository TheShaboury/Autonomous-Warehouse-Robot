controller_manager:
  ros__parameters:
    update_rate: 30
    # use_sim_time: false  # Not needed for real robot (defaults to false)

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    # ---------------------------------------------------------------
    # Added lifter_controller configuration
    # ---------------------------------------------------------------
    lifter_controller:
      type: position_controllers/JointGroupPositionController

diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_link

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.5
    wheel_radius: 0.0625

    use_stamped_vel: false

    # Covariance: HIGH values = LOW trust in encoders
    # This lets the EKF down-weight slipping wheels
    # Tuned for 35 kg chassis: wheel slip produces 0.05-0.15 m/s velocity errors
    # and heading errors during turns — covariances raised to be honest about this
    pose_covariance_diagonal: [0.05, 0.05, 0.01, 0.01, 0.01, 0.10]
    twist_covariance_diagonal: [0.05, 0.05, 0.01, 0.01, 0.01, 0.10]

    enable_odom_tf: false

    # --- Velocity & Acceleration Limits ---
    # Conservative values to prevent wheel slip on smooth floors
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0


# joint_broad:
#   ros__parameters:

# ---------------------------------------------------------------
# Lifter Controller Parameters
# ---------------------------------------------------------------
lifter_controller:
  ros__parameters:
    joints:
      - lifter_joint
    
    # Optional: Interface name (defaults to position, but good to be explicit)
    interface_name: position