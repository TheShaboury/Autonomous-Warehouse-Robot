slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    map_start_at_dock: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    
    # --- سطور السرعة اللي أخدناها من صاحبك ---
    map_update_interval: 0.5                   # تحديث الشاشة مرتين في الثانية (سرعة رهيبة في العرض)
    minimum_time_interval: 0.1                 # الغاء خنقة الوقت تماما
    minimum_travel_distance: 0.1               # ياخد لقطة كل 10 سم (هترسم الماب بسرعة جدا من غير فراغات)
    minimum_travel_heading: 0.1                # ياخد لقطة مع كل لفة بسيطة
    scan_buffer_size: 10                       # (مهم جدا) نزلناها لـ 10 زي صاحبك عشان النانو ميولعش
    # ------------------------------------------

    resolution: 0.025                          
    minimum_laser_range: 0.2                   
    max_laser_range: 6.0                       
    transform_timeout: 0.5
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: false                 
    link_match_minimum_response_fine: 0.1      
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 15          
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45   
    loop_match_minimum_response_fine: 0.55     

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.3    
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05  

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.3             # حمايتك من الزحلقة (تصديق الليدار)
    angle_variance_penalty: 0.5                # حمايتك من الزحلقة
    fine_search_angle_offset: 0.00698          
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.3              
    use_response_expansion: true